[project]
name = "fortnite-clip-ocr"
version = "0.1.0"
description = "OCR victim names from Fortnite highlight clips"
requires-python = ">=3.10"
dependencies = [
    "easyocr>=1.7",
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy",
    "opencv-python-headless",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
